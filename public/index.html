<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Void Nexus | Verificação</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #080d1b;
      color: white;
      font-family: Arial, sans-serif;
    }
    .painel {
      width: 100%;
      max-width: 420px;
      padding: 32px 22px;
      text-align: center;
      background: #111a30;
      border: 1px solid #263b69;
      border-radius: 18px;
    }
    h1 { color: #65a3ff; }
    p { color: #c4cee2; line-height: 1.6; }
    a {
      display: block;
      margin-top: 24px;
      padding: 15px;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover { background: #4752c4; }
    .aviso { font-size: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="painel">
    <h1>VOID NEXUS</h1>
    <h2>Verificação de conta</h2>
    <p>Entre com sua conta do Discord para verificar sua participação no servidor Void Nexus.</p>
    <a href="/auth/discord">Verificar com Discord</a>
    <p class="aviso">Nunca compartilhe sua senha ou token com ninguém.</p>
  </main>
</body>
</html>
